[project]
name = "bizsathi-backend"
version = "0.1.0"
description = "BizSathi FastAPI backend foundation"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = [".", ".."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["app"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
files = ["app"]
