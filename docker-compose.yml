version: '3.9'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bizsathi-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bizsathi-backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      DEBUG: "true"
      SECRET_KEY: change-me-in-production
      JWT_SECRET_KEY: change-me-in-production
      DATABASE_URL: postgresql+asyncpg://bizsathi:bizsathi@postgres:5432/bizsathi
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGINS: http://localhost:5173
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    container_name: bizsathi-postgres
    environment:
      POSTGRES_DB: bizsathi
      POSTGRES_USER: bizsathi
      POSTGRES_PASSWORD: bizsathi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: bizsathi-redis
    ports:
      - "6379:6379"

  worker:
    build:
      context: ./workers
      dockerfile: Dockerfile
    container_name: bizsathi-worker
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis

volumes:
  postgres_data:
